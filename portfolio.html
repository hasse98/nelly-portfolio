<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Nelly Elfvelin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="organic-shapes">
    <div class="organic-shape organic-shape--1"></div>
    <div class="organic-shape organic-shape--2"></div>
    <div class="organic-shape organic-shape--3"></div>
  </div>

  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav__logo">Nelly Elfvelin</a>
    <div class="nav__links">
      <a href="index.html#projects" data-i18n="nav.projects">Projekt</a>
      <a href="index.html#about" data-i18n="nav.about">Om mig</a>
      <a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
      <a href="portfolio.html" class="nav__portfolio-btn nav__portfolio-btn--active" data-i18n="nav.portfolio">Portfolio</a>
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
    </div>
    <button class="nav__hamburger" id="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#projects" data-i18n="nav.projects">Projekt</a>
    <a href="index.html#about" data-i18n="nav.about">Om mig</a>
    <a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
    <a href="portfolio.html" data-i18n="nav.portfolio">Portfolio</a>
    <button class="lang-toggle" id="langToggleMobile" aria-label="Switch language">EN</button>
  </div>

  <div class="pdf-viewer-page">
    <div class="pdf-viewer-header reveal">
      <div>
        <h1 class="pdf-viewer-header__title" data-i18n="portfolio.title">Portfolio</h1>
        <p class="pdf-viewer-header__sub">Nelly Elfvelin — Arkitektur</p>
      </div>
      <a href="images/projects/Portfolio Nelly Elfvelin compressed.pdf" download class="pdf-download-btn" data-i18n="portfolio.download">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2v8M8 10L5 7M8 10l3-3M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Ladda ner PDF
      </a>
    </div>

    <div class="pdf-catalog" id="pdfCatalog">
      <div class="pdf-loading" id="pdfLoading">
        <div class="pdf-loading__spinner"></div>
        <span data-i18n="portfolio.loading">Laddar portfolio…</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    Object.assign(translations.sv, {
      'portfolio.title': 'Portfolio',
      'portfolio.download': 'Ladda ner PDF',
      'portfolio.loading': 'Laddar portfolio…',
      'portfolio.error': 'Kunde inte ladda PDF.',
    });
    Object.assign(translations.en, {
      'portfolio.title': 'Portfolio',
      'portfolio.download': 'Download PDF',
      'portfolio.loading': 'Loading portfolio…',
      'portfolio.error': 'Could not load PDF.',
    });
    setLanguage(currentLang);

    // --- PDF.js catalog renderer ---
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDF_URL = 'images/projects/Portfolio%20Nelly%20Elfvelin%20compressed.pdf';

    async function addSpread(pdf, container, pageNums, scale) {
      const spread = document.createElement('div');
      spread.className = 'pdf-spread pdf-spread--' + (pageNums.length === 1 ? 'single' : 'double');

      for (const num of pageNums) {
        const page = await pdf.getPage(num);
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 1;
        canvas.width  = Math.floor(viewport.width  * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width  = Math.floor(viewport.width)  + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        await page.render({ canvasContext: ctx, viewport }).promise;

        spread.appendChild(canvas);
      }

      container.appendChild(spread);
    }

    async function initPDFViewer() {
      const catalog = document.getElementById('pdfCatalog');
      const loading = document.getElementById('pdfLoading');

      try {
        const pdf = await pdfjsLib.getDocument({ url: PDF_URL }).promise;
        const total = pdf.numPages;

        // Calculate scale from first page dimensions
        const firstPage = await pdf.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1 });
        const containerWidth = catalog.clientWidth;
        const gap = 6; // px between pages in a spread

        // Single page: fits ~55% of container width (feels like a centred cover)
        const singleScale = (containerWidth * 0.55) / baseViewport.width;
        // Double spread: two pages fill the container width minus the gap
        const doubleScale = ((containerWidth - gap) / 2) / baseViewport.width;

        loading.remove();

        // Page 1 — single cover
        await addSpread(pdf, catalog, [1], singleScale);

        // Remaining pages — two-page spreads
        for (let i = 2; i <= total; i += 2) {
          const pair = [i];
          if (i + 1 <= total) pair.push(i + 1);
          const scale = pair.length === 2 ? doubleScale : singleScale;
          await addSpread(pdf, catalog, pair, scale);
        }
      } catch (err) {
        loading.querySelector('span').textContent =
          (currentLang === 'en') ? 'Could not load PDF.' : 'Kunde inte ladda PDF.';
        loading.querySelector('.pdf-loading__spinner').remove();
        console.error(err);
      }
    }

    initPDFViewer();
  </script>
</body>
</html>
